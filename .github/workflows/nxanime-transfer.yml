name: NXAnime Temporary Transfer Cleanup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary transfer host file
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS --fail -X DELETE 'https://tempfile.org/api/file/rU1VGgYAYA3')
          echo "$response"
          echo "$response" | grep -q '"success":true'
