      <rect x="18" y="18" width="754" height="46" rx="12" fill="#0e2630"/>
      <circle cx="44" cy="41" r="7" fill="#ff756d"/><circle cx="68" cy="41" r="7" fill="#f4c75d"/><circle cx="92" cy="41" r="7" fill="#6ed78b"/>
