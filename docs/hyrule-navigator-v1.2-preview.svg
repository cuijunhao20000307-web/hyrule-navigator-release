        <rect width="566" height="330" rx="16" fill="url(#map)"/>
        <rect width="566" height="330" rx="16" fill="url(#grid)"/>
        <path d="M42 250 C130 160 190 210 256 115 S388 56 525 96" fill="none" stroke="#d9e8ce" stroke-opacity="0.42" stroke-width="9"/>
        <path d="M60 278 C170 246 264 288 364 220 S470 172 548 205" fill="none" stroke="#67c7dd" stroke-opacity="0.7" stroke-width="7"/>
        <g fill="#ffe27d" stroke="#4d3e14" stroke-width="3">
