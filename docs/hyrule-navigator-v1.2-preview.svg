<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">海拉鲁导航 v1.2.0 项目预览</title>
  <desc id="desc">电脑端海拉鲁地图与 Switch Tesla OVL 图片主题传送界面示意图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="0.55" stop-color="#0b2631"/>
      <stop offset="1" stop-color="#142014"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193643"/>
      <stop offset="1" stop-color="#0d1d26"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#719059"/>
      <stop offset="0.42" stop-color="#3f6d55"/>
      <stop offset="0.7" stop-color="#9a7b3f"/>
      <stop offset="1" stop-color="#314d62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#e9f7df" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="760" rx="32" fill="url(#bg)"/>
  <circle cx="1220" cy="80" r="230" fill="#d8b75e" opacity="0.07"/>
  <circle cx="140" cy="680" r="300" fill="#42d6e9" opacity="0.05"/>

  <g transform="translate(70 58)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#f5fbff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="54" font-weight="800">海拉鲁导航</text>
    <text x="374" y="13" dominant-baseline="hanging" fill="#f2cf71" font-family="Arial, sans-serif" font-size="27" font-weight="700">v1.2.0</text>
    <text x="0" y="72" dominant-baseline="hanging" fill="#a9c9d5" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22">《旷野之息》局域网地图 · 实时坐标 · 电脑选点 · Switch 按 A 确认传送</text>

    <g transform="translate(0 128)" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">
      <rect width="150" height="38" rx="19" fill="#173b45" stroke="#56dff1" stroke-opacity="0.7"/>
      <text x="75" y="25" text-anchor="middle" fill="#91eef8">Windows / macOS</text>
      <rect x="166" width="118" height="38" rx="19" fill="#2e2b1d" stroke="#e5c66e" stroke-opacity="0.7"/>
      <text x="225" y="25" text-anchor="middle" fill="#f3d986">Tesla OVL</text>
      <rect x="300" width="128" height="38" rx="19" fill="#203726" stroke="#78d08b" stroke-opacity="0.7"/>
      <text x="364" y="25" text-anchor="middle" fill="#9ce3aa">14/15 主题</text>
      <rect x="444" width="132" height="38" rx="19" fill="#33221f" stroke="#ff9d83" stroke-opacity="0.7"/>
      <text x="510" y="25" text-anchor="middle" fill="#ffc0ac">安全确认传送</text>
