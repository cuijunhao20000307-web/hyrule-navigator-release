        <rect width="170" height="330" rx="16" fill="url(#panel)"/>
        <text x="18" y="34" fill="#f4d477" font-size="18" font-weight="800">连接状态</text>
        <text x="18" y="66" fill="#82e2b4" font-size="15">● Switch 已连接</text>
        <line x1="18" y1="82" x2="152" y2="82" stroke="#5d7883" stroke-opacity="0.55"/>
        <text x="18" y="112" fill="#d7e9ee" font-size="14">坐标</text>
        <text x="18" y="136" fill="#ffffff" font-size="16" font-weight="700">X 275  Y 188</text>
        <text x="18" y="166" fill="#d7e9ee" font-size="14">目标路标</text>
        <text x="18" y="190" fill="#ffe395" font-size="16" font-weight="700">神庙安全落点</text>
        <rect x="18" y="216" width="134" height="42" rx="10" fill="#d44635"/>
        <text x="85" y="243" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">发送到 Switch</text>
        <rect x="18" y="270" width="134" height="42" rx="10" fill="#173b45" stroke="#62d7e6"/>
        <text x="85" y="297" text-anchor="middle" fill="#a9eef7" font-size="15" font-weight="800">查看传送状态</text>
      </g>
    </g>

    <g transform="translate(900 240)">
