      <rect x="54" y="36" width="322" height="398" rx="20" fill="#0a0d0f"/>
      <rect x="69" y="52" width="292" height="366" rx="12" fill="#1b1b16"/>
      <rect x="69" y="52" width="292" height="366" rx="12" fill="#d6b45b" opacity="0.08"/>
      <text x="88" y="88" fill="#ffffff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="800">海拉鲁导航</text>
      <text x="88" y="112" fill="#d8d8d8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13">图片主题版 0.7.2</text>
      <line x1="88" y1="128" x2="340" y2="128" stroke="#d5b55d"/>
      <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">
        <text x="88" y="158" fill="#f5f5f5">Switch IP</text><text x="328" y="158" text-anchor="end" fill="#ffe08a">192.168.x.x</text>
        <text x="88" y="190" fill="#f5f5f5">电脑服务</text><text x="328" y="190" text-anchor="end" fill="#9ee3a9">已启动</text>
        <text x="88" y="222" fill="#f5f5f5">Atmosphère dmnt</text><text x="328" y="222" text-anchor="end" fill="#9ee3a9">正常</text>
        <line x1="88" y1="240" x2="340" y2="240" stroke="#776634" stroke-opacity="0.65"/>
        <text x="88" y="270" fill="#f4d477" font-weight="800">电脑路标传送</text>
        <text x="88" y="302" fill="#f5f5f5">目标坐标</text><text x="328" y="302" text-anchor="end" fill="#ffe08a">275 / 188 / 0</text>
        <rect x="86" y="324" width="256" height="46" rx="10" fill="#2d2618" stroke="#ddbd64"/>
        <text x="214" y="353" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">传送到电脑路标 · 按 A</text>
        <text x="214" y="397" text-anchor="middle" fill="#ccb773" font-size="12">LINKO · Tesla OVL（无 NSP）</text>
      </g>
      <circle cx="26" cy="142" r="13" fill="#26343c"/><circle cx="404" cy="142" r="13" fill="#26343c"/>
      <circle cx="26" cy="188" r="13" fill="#26343c"/><circle cx="404" cy="188" r="13" fill="#26343c"/>
      <circle cx="26" cy="330" r="27" fill="#26343c"/><circle cx="404" cy="330" r="27" fill="#26343c"/>
    </g>
  </g>

  <text x="700" y="735" text-anchor="middle" fill="#708b94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">非官方玩家工具 · 适用于《塞尔达传说：旷野之息》1.6.0 · 原作者 LINKO</text>
</svg>